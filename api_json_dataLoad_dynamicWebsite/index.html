<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practise-json-api</title>
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* container */
    #postContainer {
        max-width: 1000px;
        margin: 40px auto;
        padding: 0 15px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        /* 👈 3 cards per row */
        gap: 20px;
    }

    /* card */
    .post-card {
        background: #fff;
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        transition: 0.3s ease;
        height: 100%;
    }

    /* hover */
    .post-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    }

    /* title */
    .post-title {
        font-size: 20px;
        color: #222;
        margin-bottom: 10px;
    }

    /* body */
    .post-body {
        font-size: 15px;
        color: #555;
        line-height: 1.6;
    }

    .loadPost {
        display: block;
        margin: 40px auto;
        padding: 14px 34px;

        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: #fff;
        font-size: 16px;
        font-weight: 600;

        border: none;
        border-radius: 30px;
        cursor: pointer;

        box-shadow: 0 10px 25px rgba(79, 70, 229, 0.35);
        transition: all 0.3s ease;
    }

    /* hover */
    .loadPost:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 35px rgba(79, 70, 229, 0.45);
    }

    /* active */
    .loadPost:active {
        transform: scale(0.96);
    }

    /* disabled state (optional) */
    .loadPost:disabled {
        background: #c7c9ff;
        cursor: not-allowed;
        box-shadow: none;
    }

    .loadPost {
        display: block;
        margin: 30px auto;
        padding: 10px 24px;

        background: #222;
        color: #fff;
        font-size: 14px;

        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    .loadPost:hover {
        background: #444;
    }

    .allPost {
        text-align: center;
    }
</style>

<body>
    <!-- <h1>Nothing here. mystery in console area</h1>
    <button onclick="loadData()">Load data</button> -->
    <button onclick="loadPost()" class="loadPost">load posts</button>

    <!-- creat post card -->

    <h1 class="allPost">All posts</h1>

    <div id="postContainer">

    </div>
    <!-- <h1>show post title</h1>
    <ul id="postContainer"></ul> -->


    <!-- <script src="./intro-json.js"></script>
    <script src="./load-json-data-using-fetch-func.js"></script> -->
    <script src="./posts.js"></script>
</body>

</html>
